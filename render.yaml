services:
  - type: web
    name: resolution-intelligence
    runtime: docker
    plan: free
    region: virginia
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: REFUND_HOSTED
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_DATABASE_URL
        sync: false
      - key: REFUND_ACCESS_PASSWORD
        sync: false
      - key: SEARCH_PROVIDER
        value: keenable
      - key: KEENABLE_API_KEY
        sync: false
      - key: ENABLE_SMS
        value: "false"
      - key: BANK_REVIEW_THRESHOLD_CENTS
        value: "50000"
